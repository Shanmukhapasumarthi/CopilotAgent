[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codepilot-agent"
version = "0.1.0"
description = "Autonomous code engineering agent (Phase 1 foundation)"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
